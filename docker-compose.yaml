---
networks:
  nrer:
  mnmn:
    external: true

services:
  erlangred-nodered-template:
    build:
      context: ./
      dockerfile: Dockerfile.nodered
    env_file: .env.nodered
    ports:
      - "0.0.0.0:1890:1880"
    networks:
      - nrer
      - mnmn
    volumes:
      - ./node-red/data:/data
